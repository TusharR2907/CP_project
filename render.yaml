services:
  # The FastAPI Backend
  - type: web
    name: weather-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OWM_API_KEY
        sync: false

  # The Flask Frontend
  - type: web
    name: weather-frontend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: API_BASE
        fromService:
          type: web
          name: weather-backend
          property: host
          # Render automatically inserts the host URL of the backend here
